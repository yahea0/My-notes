name: my_notes
description: A luxury glass notes application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  math_expressions: ^2.4.0   # لحساب العمليات الرياضية
  intl: ^0.19.0              # لتنسيق التاريخ والوقت
  image_picker: ^1.0.7       # لاختيار الصور من المعرض

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
